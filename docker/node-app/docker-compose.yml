services:
  node-app:
    container_name: express-node-app-container
    build: .
    ports:
      - "4000:4000"
    env_file:
      - ./.env
    depends_on:
      - mongodb
      
  mongodb:
    image: mongo
    container_name: mongodb-container
    volumes:  
    # Named volume: keeps MongoDB data even if the container is deleted
      - mongo-data:/data/db

  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "8080:80" # جهازى : container
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-app

volumes:
  mongo-data: