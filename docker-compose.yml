# Purpose: Define the base Docker Compose configuration for the application stack.

services:

  # Node.js application service
  node-app:
    container_name: express-node-app-container

    # Build the Docker image using the Dockerfile in the current directory
    build: .

    # Map host port 4000 to container port 4000
    # Format: "host_port:container_port"
    ports:
      - "4000:4000"

    # Load environment variables from the .env file
    env_file:
      - ./.env

    # Start MongoDB before starting the Node.js application
    depends_on:
      - mongodb

  # MongoDB database service
  mongodb:
    image: mongo
    container_name: mongodb-container

    # Named volume: keeps MongoDB data even if the container is deleted
    volumes:
      - mongo-data:/data/db

  # Nginx reverse proxy service
  nginx:
    image: nginx:latest
    container_name: nginx-container

    # Map host port 8080 to Nginx container port 80
    # Format: "host_port:container_port"
    ports:
      - "8080:80"

    # Mount the custom Nginx configuration as read-only
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    # Start Node.js before starting Nginx
    depends_on:
      - node-app

# Define named volumes used by the services
volumes:

  # Persistent storage for MongoDB data
  mongo-data:
