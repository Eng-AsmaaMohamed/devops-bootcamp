# Name of the GitHub Actions workflow
name: CI

# Define when the workflow should run
on: 
  push:
    branches: 
      - main
            
  pull_request:
    branches:
      - main
            
jobs:
  # Job name: build
  build:
    runs-on: ubuntu-latest

    steps:
        # Step 1: Download the repository code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

        # Step 2: Install and configure Node.js
      - name: set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # Enable npm dependency caching to speed up future runs
          cache: npm

        # Step 3: Install dependencies exactly as defined in package-lock.json
      - name: Install dependencies
        run: npm ci

        # Step 4: Build the Docker image
      - name: Build Docker image
        run: docker build -t node-app:ci .
